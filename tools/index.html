<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tools — iNabiTek</title>
    <meta name="description" content="iNabiTek — technical tools, calculators and web applications.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 24px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        header p {
            margin: 6px 0 0;
            color: #aaa;
            font-size: 15px;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 50px 25px;
        }

        .intro {
            margin-bottom: 45px;
        }

        .intro h2 {
            font-size: 42px;
            font-weight: 500;
            margin: 0 0 15px;
        }

        .intro p {
            max-width: 650px;
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            display: block;
            padding: 28px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .card p {
            margin: 0;
            color: #666;
            line-height: 1.5;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
        }

        .back:hover {
            text-decoration: underline;
        }

        footer {
            max-width: 1000px;
            margin: 20px auto 0;
            padding: 25px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .intro h2 {
                font-size: 32px;
            }

            main {
                padding-top: 35px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>iNabiTek</h1>
    <p>Technical projects, experiments &amp; tools</p>
</header>

<main>

    <a class="back" href="/">← Back to iNabiTek</a>

    <section class="intro">
        <h2>Tools</h2>
        <p>
            Calculators and small web applications for engineering,
            measurement and analysis.
        </p>
    </section>

    <section class="cards">

        <a class="card" href="/tools/mt-stirling.html">
            <h3>Mt Stirling Snow &amp; Weather</h3>
            <p>
                Mt Stirling webcams and a 7-day snow and weather forecast.
            </p>
        </a>

    </section>

</main>

<footer>
    © 2026 iNabiTek
</footer>

</body>
</html>
