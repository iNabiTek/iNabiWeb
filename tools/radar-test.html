<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Radar Test | iNabiTek</title>
<meta name="description" content="Experimental weather radar map for Mt Stirling.">

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f5f5f5;
    color:#222
}

header{
    background:#111;
    color:#fff;
    padding:24px 30px
}

header h1{
    margin:0;
    font-size:28px;
    font-weight:600;
    letter-spacing:.5px
}

header p{
    margin:6px 0 0;
    color:#aaa;
    font-size:15px
}

main{
    max-width:1000px;
    margin:0 auto;
    padding:45px 25px
}

.back{
    display:inline-block;
    margin-bottom:28px;
    color:#555;
    text-decoration:none;
    font-size:14px
}

.back:hover{
    text-decoration:underline
}

h2{
    font-size:38px;
    font-weight:500;
    margin:0 0 10px
}

.lead{
    max-width:700px;
    font-size:17px;
    line-height:1.6;
    color:#555;
    margin:0 0 25px
}

#map{
    width:100%;
    height:600px;
    border:1px solid #ddd;
    border-radius:10px;
    overflow:hidden;
    background:#ddd
}

.radar-info{
    margin-top:15px;
    padding:18px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:10px;
}

.radar-title{
    font-size:14px;
    font-weight:600;
    margin-bottom:10px
}

.legend{
    height:16px;
    width:100%;
    border-radius:4px;
    background:linear-gradient(
        to right,
        rgba(180,180,255,.45),
        rgba(80,160,255,.65),
        rgba(0,210,255,.75),
        rgba(0,255,150,.8),
        rgba(255,255,0,.85),
        rgba(255,150,0,.9),
        rgba(255,50,50,.95),
        rgba(180,0,180,1)
    );
}

.legend-labels{
    display:flex;
    justify-content:space-between;
    margin-top:5px;
    color:#777;
    font-size:11px
}

.radar-status{
    margin-top:12px;
    color:#777;
    font-size:12px
}

footer{
    max-width:1000px;
    margin:20px auto 0;
    padding:25px;
    color:#888;
    font-size:13px
}

@media(max-width:650px){
    main{padding-top:30px}
    h2{font-size:32px}
    #map{height:500px}
}
</style>
</head>

<body>

<header>
    <h1>iNabiTek</h1>
    <p>Technical projects, experiments &amp; tools</p>
</header>

<main>

    <a class="back" href="/tools/index.html">
        ← iNabiTek tools
    </a>

    <h2>Weather Radar Test</h2>

    <p class="lead">
        Recent radar imagery centred on Mt Stirling, Victoria.
    </p>

    <div id="map"></div>

    <div class="radar-info">

        <div class="radar-title">
            Radar intensity — dBZ
        </div>

        <div class="legend"></div>

        <div class="legend-labels">
            <span>&lt;10</span>
            <span>20</span>
            <span>30</span>
            <span>40</span>
            <span>50</span>
            <span>60+</span>
        </div>

        <div class="radar-status" id="radar-status">
            Loading radar…
        </div>

    </div>

</main>

<footer>
    © 2026 iNabiTek · Radar data by RainViewer · Map data © OpenStreetMap contributors
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const mtStirling = [-37.12651,146.49801];

const map = L.map("map", {
    minZoom: 5,
    maxZoom: 7
}).setView(mtStirling,7);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"© OpenStreetMap contributors"
    }
).addTo(map);

L.marker(mtStirling)
    .addTo(map)
    .bindPopup("<strong>Mt Stirling</strong>");

async function loadRadar(){

    try{

        const response = await fetch(
            "https://api.rainviewer.com/public/weather-maps.json"
        );

        if(!response.ok){
            throw new Error("Radar service unavailable");
        }

        const data = await response.json();

        const frames =
            data.radar &&
            data.radar.past;

        if(!frames || !frames.length){
            throw new Error("No radar frames available");
        }

        const layers = frames.map(frame => {

            return L.tileLayer(
                "https://tilecache.rainviewer.com" +
                frame.path +
                "/256/{z}/{x}/{y}/2/1_1.png",
                {
                    minZoom:5,
                    maxZoom:7,
                    opacity:0,
                    attribution:"Radar: RainViewer"
                }
            ).addTo(map);

        });

        let current = layers.length - 1;

        function formatTime(unixTime){

            return new Date(
                unixTime * 1000
            ).toLocaleTimeString(
                "en-AU",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

        }

        function showFrame(index){

            layers.forEach((layer,i)=>{

                layer.setOpacity(
                    i === index ? 0.70 : 0
                );

            });

            current = index;

            document.getElementById(
                "radar-status"
            ).textContent =
                "Radar frame: " +
                formatTime(frames[index].time) +
                " · " +
                (index + 1) +
                " of " +
                frames.length;

        }

        showFrame(current);

        let playing = false;
        let timer = null;

        const control =
            L.control({
                position:"topright"
            });

        control.onAdd = function(){

            const element =
                L.DomUtil.create(
                    "div",
                    "leaflet-bar"
                );

            element.style.cssText =
                "background:#fff;" +
                "padding:8px 10px;" +
                "cursor:pointer;" +
                "font-size:13px";

            element.textContent =
                "▶ Animate radar";

            L.DomEvent.disableClickPropagation(
                element
            );

            element.onclick = function(){

                playing = !playing;

                element.textContent =
                    playing
                    ? "❚❚ Pause radar"
                    : "▶ Animate radar";

                if(playing){

                    timer = setInterval(
                        function(){

                            showFrame(
                                (current + 1) %
                                layers.length
                            );

                        },
                        500
                    );

                }else{

                    clearInterval(timer);

                }

            };

            return element;

        };

        control.addTo(map);

    }catch(error){

        console.error(error);

        document.getElementById(
            "radar-status"
        ).textContent =
            "Radar data could not be loaded.";

    }

}

loadRadar();

</script>

</body>
</html>
