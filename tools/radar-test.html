<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Radar Test | iNabiTek</title>
<meta name="description" content="Experimental weather radar map for Mt Stirling.">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f5f5f5;
    color:#222
}

header{
    background:#111;
    color:#fff;
    padding:24px 30px
}

header h1{
    margin:0;
    font-size:28px;
    font-weight:600;
    letter-spacing:.5px
}

header p{
    margin:6px 0 0;
    color:#aaa;
    font-size:15px
}

main{
    max-width:1000px;
    margin:0 auto;
    padding:45px 25px
}

.back{
    display:inline-block;
    margin-bottom:28px;
    color:#555;
    text-decoration:none;
    font-size:14px
}

.back:hover{
    text-decoration:underline
}

h2{
    font-size:38px;
    font-weight:500;
    margin:0 0 10px
}

.lead{
    max-width:700px;
    font-size:17px;
    line-height:1.6;
    color:#555;
    margin:0 0 25px
}

#map{
    width:100%;
    height:600px;
    border:1px solid #ddd;
    border-radius:10px;
    overflow:hidden;
    background:#ddd
}

.info{
    margin-top:15px;
    padding:15px 18px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:10px;
    color:#666;
    font-size:13px;
    line-height:1.5
}

footer{
    max-width:1000px;
    margin:20px auto 0;
    padding:25px;
    color:#888;
    font-size:13px
}

@media(max-width:650px){
    main{padding-top:30px}
    h2{font-size:32px}
    #map{height:500px}
}
</style>
</head>

<body>

<header>
    <h1>iNabiTek</h1>
    <p>Technical projects, experiments &amp; tools</p>
</header>

<main>

    <a class="back" href="/tools/index.html">← iNabiTek tools</a>

    <h2>Weather Radar Test</h2>

    <p class="lead">
        Experimental recent radar imagery centred on Mt Stirling, Victoria.
    </p>

    <div id="map"></div>

    <div class="info">
        Radar imagery: RainViewer.
        Map data: OpenStreetMap.
        Radar animation shows recent available observations.
    </div>

</main>

<footer>© 2026 iNabiTek</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const mtStirling = [-37.12651, 146.49801];

const map = L.map("map").setView(mtStirling, 9);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors"
    }
).addTo(map);

L.marker(mtStirling)
    .addTo(map)
    .bindPopup("<strong>Mt Stirling</strong>");

async function loadRadar() {

    try {

        const response = await fetch(
            "https://api.rainviewer.com/public/weather-maps.json"
        );

        if (!response.ok) {
            throw new Error("Radar service unavailable");
        }

        const data = await response.json();

        const frames = data.radar && data.radar.past;

        if (!frames || !frames.length) {
            throw new Error("No radar frames available");
        }

        const layers = frames.map(frame => {

            return L.tileLayer(
                "https://tilecache.rainviewer.com" +
                frame.path +
                "/256/{z}/{x}/{y}/2/1_1.png",
                {
                    opacity: 0,
                    attribution: "Radar: RainViewer"
                }
            ).addTo(map);

        });

        let current = layers.length - 1;

        function showFrame(index) {

            layers.forEach((layer, i) => {

                layer.setOpacity(
                    i === index ? 0.65 : 0
                );

            });

            current = index;
        }

        showFrame(current);

        let playing = false;
        let timer = null;

        const control = L.control({
            position:"topright"
        });

        control.onAdd = function() {

            const element =
                L.DomUtil.create(
                    "div",
                    "leaflet-bar"
                );

            element.style.cssText =
                "background:#fff;" +
                "padding:8px 10px;" +
                "cursor:pointer;" +
                "font-size:13px";

            element.textContent =
                "▶ Animate radar";

            L.DomEvent.disableClickPropagation(element);

            element.onclick = function() {

                playing = !playing;

                element.textContent =
                    playing
                    ? "❚❚ Pause radar"
                    : "▶ Animate radar";

                if (playing) {

                    timer = setInterval(
                        function() {

                            showFrame(
                                (current + 1) %
                                layers.length
                            );

                        },
                        500
                    );

                } else {

                    clearInterval(timer);

                }

            };

            return element;
        };

        control.addTo(map);

    } catch (error) {

        console.error(error);

        document.getElementById("map").innerHTML =
            '<div style="padding:20px;font:14px sans-serif;color:#777">' +
            'Radar data could not be loaded.' +
            '</div>';

    }

}

loadRadar();
</script>

</body>
</html>
